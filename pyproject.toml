[tool.poetry]
name = "volnorm"
version = "0.1.1"
description = "Volatility-normalized feature engineering toolkit for financial time series"
authors = ["Diogo Ribeiro <dfr@esmad.ipp.pt>"]
packages = [{ include = "volnorm", from = "src" }]
include = [
    { path = "src/volnorm/data/spy_sample.csv" },
]

[tool.poetry.dependencies]
python = "^3.9"
pandas = "^2.2"
numpy = ">=1.26"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.4.0"
mypy = "^1.9"
black = "^24.4"
pandas-stubs = "^2.2"
tomli = "^2.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
volnorm = "volnorm.cli:main"

[tool.mypy]
ignore_missing_imports = true
