[tool.poetry]
name = "volnorm"
version = "0.1.0"
description = "Volatility-normalized feature engineering toolkit for financial time series"
authors = ["Your Name <you@example.com>"]
packages = [{ include = "volnorm" }]

[tool.poetry.dependencies]
python = "^3.9"
pandas = "^2.2"
numpy = ">=1.26"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.4.0"
mypy = "^1.9"
black = "^24.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
